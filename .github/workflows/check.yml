name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: ci-only-secret-never-use-outside-tests
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check frontend/app.js
      - run: node --check frontend/projects.js
      - run: node --check frontend/platform.js
      - run: node --check frontend/i18n.js
      - run: node scripts/check_i18n.cjs
      - run: node scripts/check_header.cjs
      - run: node scripts/check_likes.cjs
