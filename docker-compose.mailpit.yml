# Development only: captured messages never leave this local mailbox.
services:
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  web:
    environment: &test-mail
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_STARTTLS: "false"
      FROM_EMAIL: dev@example.test
  worker:
    environment: *test-mail
  beat:
    environment: *test-mail
